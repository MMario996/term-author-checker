      '<h3>So funktionieren Regeln & eigene Prompts</h3><ul class="help-list">' +
      '<li><b>+ Neue Regel / KI-Prompt erstellen</b> legt eine neue Regel oder einen eigenen KI-Prompt an. Wähle eine bestehende Kategorie oder lege eine neue an, entscheide, ob es eine strikte „Regel“ oder ein freier „KI-Prompt“ ist, vergib Titel und Beschreibung und (bei KI-Prompts) eine ausführliche Anweisung, der Gemini beim Prüfen eines Dokuments folgt.</li>' +

      '<h3 style="margin-top:16px;">Export, Import & mit Kolleg:innen teilen</h3><ul class="help-list">' +

      '<li><b>+ Créer une règle / un prompt IA</b> crée une nouvelle règle ou un prompt IA personnalisé. Choisissez une catégorie existante ou créez-en une, indiquez s’il s’agit d’une « règle » stricte ou d’un « prompt IA » libre, donnez-lui un titre et une description et (pour les prompts IA) une instruction détaillée que Gemini suivra lors de la vérification d’un document.</li>' +
      '<li>Les catégories (abréviations, grammaire, …) peuvent être dépliées. Chaque règle possède une case à cocher pour l’activer ou la désactiver. Seules les règles activées sont utilisées lors de la prochaine vérification.</li>' +
      '<li><b>Enregistrer les paramètres</b> sauvegarde vos modifications durablement : les règles activées/désactivées sont enregistrées pour votre compte et l’ensemble complet des règles, y compris les règles personnalisées, est écrit dans un fichier <b>active_rules.json</b> du dossier Google Drive <b>« TermCheck Rules »</b> de votre propre Drive.</li></ul>' +
      '<h3 style="margin-top:16px;">Export, import & partage avec un collègue</h3><ul class="help-list">' +
      '<li><b>Export JSON</b> écrit votre jeu de règles actuel, tel qu’il est affiché dans cette fenêtre, dans ce même fichier <b>active_rules.json</b> du dossier <b>« TermCheck Rules »</b> de votre Drive. Ce dossier est créé automatiquement lors du premier enregistrement ou export ; il est privé et n’est pas partagé automatiquement.</li>' +
      '<li><b>Import JSON</b> permet de choisir un fichier JSON sur votre ordinateur et d’en charger les règles dans cette fenêtre. Les règles portant le même nom interne remplacent l’existante, les nouvelles sont ajoutées. L’import ne modifie que l’affichage ; rien n’est encore enregistré.</li>' +
      '<li>Important : un import ne prend effet qu’après un clic sur <b>Enregistrer les paramètres</b>. Si vous fermez la fenêtre sans enregistrer, les règles importées sont perdues.</li>' +
      '<li><b>Pour partager vos règles avec un collègue :</b><ol style="margin:6px 0 0 18px; padding:0;">' +

      '<h3>Kurallar ve özel istemler nasıl çalışır</h3><ul class="help-list">' +
      '<li><b>+ Yeni kural / yapay zekâ istemi oluştur</b> yeni bir kural veya özel bir yapay zekâ istemi oluşturur. Mevcut bir kategori seçin veya yenisini oluşturun, katı bir "kural" mı yoksa serbest bir "yapay zekâ istemi" mi olduğunu belirleyin, başlık ve açıklama girin ve (yapay zekâ istemleri için) Gemini’nin belgeyi kontrol ederken izleyeceği ayrıntılı talimatı yazın.</li>' +

  });
  root.querySelectorAll('[data-i18n-title]').forEach(function(el){
    var v = t(el.getAttribute('data-i18n-title'));
    el.setAttribute('title', v);
    if (el.hasAttribute('aria-label')) el.setAttribute('aria-label', v);
  });
}

function getUiLang(){ return _uiLang; }

// Befüllt alle <select class="ui-lang-select"> mit den UI-Sprachen und
// verbindet sie mit setUiLang. Danach wird die Seite einmal übersetzt.
function initUiLangSelects(){
  document.querySelectorAll('.ui-lang-select').forEach(function(sel){
    sel.innerHTML = UI_LANGS.map(function(p){ return '<option value="'+p[0]+'">'+_i18nEscAttr(p[1])+'</option>'; }).join('');
    sel.value = _uiLang;
    sel.addEventListener('change', function(){ setUiLang(this.value); });
  });
  document.documentElement.lang = _uiLang;
  applyI18n(document);
  if (typeof onUiLangChanged === 'function') onUiLangChanged(_uiLang);
}

// Name einer (Inhalts-)Sprache in der aktuellen UI-Sprache, z.B. langName('fr')
// -> "Französisch" bei deutscher UI. Nutzt die im Browser eingebaute Liste.
function langName(code, fallback){
  try {
    var dn = new Intl.DisplayNames([_uiLang], { type: 'language' });
    var n = dn.of(code);
    if (n && n !== code) return n.charAt(0).toLocaleUpperCase(_uiLang) + n.slice(1);
  } catch(e) {}
  return fallback || code;
}
function setUiLang(lang){
  if (!I18N[lang]) lang = 'en';
  _uiLang = lang;
  try { localStorage.setItem(UI_LANG_KEY, lang); } catch(e) {}
  if (typeof I18N_PERSIST === 'function') { try { I18N_PERSIST(lang); } catch(e) {} }
  document.documentElement.lang = lang;
  document.querySelectorAll('.ui-lang-select').forEach(function(sel){ sel.value = lang; });
  applyI18n(document);
  if (typeof onUiLangChanged === 'function') onUiLangChanged(lang);
}
</script>

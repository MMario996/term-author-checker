// ─── RUNTIME ───────────────────────────────────────────────────────────────
var UI_LANG_KEY = 'termsearch_ui_lang_v1';
var _uiLang = (function(){
  try { var l = localStorage.getItem(UI_LANG_KEY); if (l && I18N[l]) return l; } catch(e) {}
  return 'en';
})();

function _i18nRaw(lang, key){
  var d = I18N[lang];
  return (d && Object.prototype.hasOwnProperty.call(d, key)) ? d[key] : undefined;
}
function _i18nFormat(s, vars){
  if (!vars) return s;
  return String(s).replace(/\{(\w+)\}/g, function(m, k){ return (vars[k] !== undefined && vars[k] !== null) ? String(vars[k]) : m; });
}
// Übersetzt einen Key in die aktuelle UI-Sprache (Fallback: Englisch, dann Key).
// Listen (z.B. Lade-Texte) werden als Array zurückgegeben.
function t(key, vars){
  var s = _i18nRaw(_uiLang, key);
  if (s === undefined) s = _i18nRaw('en', key);
  if (s === undefined) return key;
  if (Array.isArray(s)) return s;
  return _i18nFormat(s, vars);
}
// Plural-Key auflösen: base_one für n===1 (falls vorhanden), sonst base_other.
function tnKey(base, n){
  if (n === 1 && (_i18nRaw(_uiLang, base + '_one') !== undefined || (_i18nRaw(_uiLang, base + '_other') === undefined && _i18nRaw('en', base + '_one') !== undefined))) return base + '_one';
  return base + '_other';
}
function tn(base, n, vars){
  vars = vars || {}; if (vars.n === undefined) vars.n = n;
  return t(tnKey(base, n), vars);
}
function _i18nEscAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Liefert ein <span>, das sich beim Sprachwechsel selbst neu übersetzt.
function tl(key, vars){
  var args = vars ? ' data-i18n-args="' + _i18nEscAttr(JSON.stringify(vars)) + '"' : '';
  return '<span data-i18n="' + key + '"' + args + '>' + _i18nEscAttr(t(key, vars)) + '</span>';
}
function tln(base, n, vars){
  vars = vars || {}; if (vars.n === undefined) vars.n = n;
  return tl(tnKey(base, n), vars);
}
// title="…" Attribut, das beim Sprachwechsel mitgezogen wird.
function tAttrTitle(key){ return ' title="' + _i18nEscAttr(t(key)) + '" data-i18n-title="' + key + '"'; }

// Übersetzt alle markierten Elemente unterhalb von root:
//   data-i18n="key" (+ optional data-i18n-args='{"n":3}')  → textContent
//   data-i18n-placeholder="key"                            → placeholder
//   data-i18n-title="key"                                  → title / aria-label
function applyI18n(root){
  root = root || document;
  root.querySelectorAll('[data-i18n]').forEach(function(el){
    var vars = null;
    var raw = el.getAttribute('data-i18n-args');
    if (raw) { try { vars = JSON.parse(raw); } catch(e) {} }
    el.textContent = t(el.getAttribute('data-i18n'), vars);
  });
  root.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
    el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
  });
  root.querySelectorAll('[data-i18n-title]').forEach(function(el){
    var v = t(el.getAttribute('data-i18n-title'));
    el.setAttribute('title', v);
    if (el.hasAttribute('aria-label')) el.setAttribute('aria-label', v);
  });
}

function getUiLang(){ return _uiLang; }
function setUiLang(lang){
  if (!I18N[lang]) lang = 'en';
  _uiLang = lang;
  try { localStorage.setItem(UI_LANG_KEY, lang); } catch(e) {}
  document.documentElement.lang = lang;
  applyI18n(document);
  if (typeof onUiLangChanged === 'function') onUiLangChanged(lang);
}

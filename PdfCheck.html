<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFED00; --yellow-dim:#E6D500; --ink:#3A3A3A; --white:#FFFFFF;
  --gray-50:#FAFAFA; --gray-100:#F2F2F2; --gray-150:#E9E9E9; --gray-200:#DDDDDD; --gray-300:#C4C4C4;
  --gray-400:#9A9A9A; --gray-500:#767676; --gray-600:#565656; --red:#D32F2F; --green:#2E7D32;
  --ff-head:"Oswald","Arial Narrow",sans-serif; --ff-body:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:var(--white); color:var(--ink); font-family:var(--ff-body); font-size:15px; -webkit-font-smoothing:antialiased; }
#app{ max-width:760px; margin:0 auto; padding:22px 18px 40px; }
.brand{ font-family:var(--ff-head); font-size:12px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--gray-500); }
h1{ font-family:var(--ff-head); font-size:22px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; margin:2px 0 4px; }
.file{ font-size:14px; color:var(--gray-600); word-break:break-word; }
.file b{ color:var(--ink); }
.box{ border:1px solid var(--gray-200); padding:18px; margin-top:18px; }
.steps{ display:flex; align-items:center; gap:10px; list-style:none; margin-bottom:18px; }
.steps li{ display:flex; align-items:center; gap:8px; font-family:var(--ff-head); font-size:13px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--gray-400); }
.steps .dot{ width:24px; height:24px; border-radius:50%; border:2px solid var(--gray-300); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--gray-400); background:var(--white); }
.steps li.active{ color:var(--ink); }
.steps li.active .dot{ border-color:var(--ink); background:var(--yellow); color:var(--ink); }
.steps li.done{ color:var(--gray-600); }
.steps li.done .dot{ border-color:var(--ink); background:var(--ink); color:var(--yellow); }
.steps .line{ flex:1; height:2px; background:var(--gray-200); min-width:24px; }
.steps .line.done{ background:var(--ink); }
.prog-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.pct{ font-family:var(--ff-head); font-size:34px; font-weight:600; line-height:1; }
.eta{ text-align:right; }
.eta-main{ font-size:16px; font-weight:600; }
.eta-sub{ font-size:12.5px; color:var(--gray-500); margin-top:2px; }
.bar{ position:relative; height:14px; background:var(--gray-150); margin:12px 0 12px; overflow:hidden; border-radius:7px; }
.bar > div{ height:100%; width:0; border-radius:7px; background:var(--yellow); box-shadow:inset 0 0 0 1px var(--yellow-dim);
  background-image:linear-gradient(45deg, rgba(58,58,58,.10) 25%, transparent 25%, transparent 50%, rgba(58,58,58,.10) 50%, rgba(58,58,58,.10) 75%, transparent 75%);
  background-size:20px 20px; animation:stripes 1s linear infinite; transition:width 1s linear; }
@keyframes stripes{ to{ background-position:20px 0; } }
@media (prefers-reduced-motion: reduce){ .bar > div{ animation:none; transition:none; } }
.status{ font-size:14px; line-height:1.5; }
.hint{ font-size:13px; color:var(--gray-500); margin-top:8px; line-height:1.45; }
.spinner{ display:inline-block; width:14px; height:14px; border:2px solid var(--gray-300); border-top-color:var(--ink); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.error{ border-color:var(--red); }
.error .status{ color:var(--red); }
.btn{ display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--ink); background:var(--white); color:var(--ink);
  font-family:var(--ff-head); font-size:13px; font-weight:600; letter-spacing:.5px; text-transform:uppercase;
  padding:9px 14px; cursor:pointer; text-decoration:none; }
.btn:hover{ background:var(--gray-100); }
.btn.primary{ background:var(--yellow); border-color:var(--yellow); }
.btn.primary:hover{ background:var(--yellow-dim); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center; }
.link-out{ font-size:14px; font-weight:600; color:var(--ink); }
.summary{ font-family:var(--ff-head); font-size:20px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; }
.note{ margin-top:10px; padding:8px 10px; background:#FFF8D6; border-left:3px solid var(--yellow); font-size:13px; line-height:1.45; }
.issue{ border:1px solid var(--gray-200); margin-top:10px; }
.issue-head{ display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--gray-50); border-bottom:1px solid var(--gray-150); font-size:13px; color:var(--gray-500); }
.badge{ font-family:var(--ff-head); font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:2px 8px; }
.badge.terminology{ background:var(--yellow); color:var(--ink); }
.badge.grammar{ background:var(--gray-200); color:var(--gray-600); }
.badge.style{ background:var(--ink); color:var(--yellow); }
.issue-body{ padding:10px 12px; }
.diff{ font-size:15px; line-height:1.5; word-break:break-word; }
.diff s{ color:var(--red); text-decoration-thickness:1.5px; }
.diff .arrow{ color:var(--gray-400); margin:0 6px; }
.diff b{ font-weight:600; }
.expl{ font-size:13.5px; color:var(--gray-500); margin-top:4px; line-height:1.5; }
.small{ font-size:12.5px; color:var(--gray-500); margin-top:10px; line-height:1.45; }
.hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="brand">Kärcher TermCheck</div>
  <h1 id="title"></h1>
  <div class="file" id="fileLine"></div>

  <div class="box" id="progressBox">
    <ol class="steps">
      <li id="step1" class="active"><span class="dot">1</span><span id="step1Lbl"></span></li>
      <li class="line" id="line1" aria-hidden="true"></li>
      <li id="step2"><span class="dot">2</span><span id="step2Lbl"></span></li>
      <li class="line" id="line2" aria-hidden="true"></li>
      <li id="step3"><span class="dot">3</span><span id="step3Lbl"></span></li>
    </ol>
    <div class="prog-head">
      <div class="pct" id="pctText">0 %</div>
      <div class="eta">
        <div class="eta-main" id="etaText" aria-live="polite"></div>
        <div class="eta-sub" id="elapsedText"></div>
      </div>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div id="barFill"></div></div>
    <div class="status" id="statusText"><span class="spinner"></span><span id="statusMsg"></span></div>
    <div class="hint" id="keepOpen"></div>
  </div>

  <div class="box error hidden" id="errorBox">
    <div class="status" id="errorText"></div>
    <div class="actions"><button class="btn primary" id="retryBtn"></button></div>
  </div>

  <div class="hidden" id="resultBox">
    <div class="box">
      <div class="summary" id="summary"></div>
      <div id="notes"></div>
      <div class="actions" id="resultActions">
        <button class="btn primary" id="annotBtn"></button>
        <button class="btn" id="sheetBtn"></button>
      </div>
      <div class="actions" id="annotOut"></div>
      <div class="small" id="annotHelp"></div>
    </div>
    <div id="issues"></div>
    <div class="actions" style="margin-top:22px;">
      <button class="btn" id="closeBtn"></button>
      <span class="small" id="closeHint" style="margin:0;"></span>
    </div>
  </div>
</div>

<script>
// Vom Server (DrivePdfWeb.gs): Datei, Prüfsprache und alle Texte in der UI-Sprache.
var FILE_ID = <?!= JSON.stringify(fileId) ?>;
var CHECK_LANG = <?!= JSON.stringify(checkLang) ?>;
var CHECK_LANG_NAME = <?!= JSON.stringify(checkLangName) ?>;
var T = <?!= JSON.stringify(texts) ?>;

var MAX_AUTO_RETRIES = 3;
var _stateId = null, _retries = 0, _result = null, _fileName = '';

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Texte dürfen <b>/<i>/<br> enthalten (vertrauenswürdig, vom Server); eingesetzte Werte werden escaped.
function t(key, vars){
  var s = T[key] || key;
  return s.replace(/\{(\w+)\}/g, function(m, n){ return (vars && n in vars) ? esc(vars[n]) : m; });
}
function $(id){ return document.getElementById(id); }
function show(id, on){ $(id).classList.toggle('hidden', !on); }
function run(fn, args, ok, fail){
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
  r[fn].apply(r, args);
}

document.addEventListener('DOMContentLoaded', function(){
  $('title').textContent = '📄 ' + (T['w.title'] || 'PDF check');
  $('keepOpen').innerHTML = '⏳ ' + t('w.keepOpen');
  $('retryBtn').textContent = '🔄 ' + (T['w.retry'] || 'Try again');
  $('annotBtn').textContent = '🖍️ ' + T['d.openAnnotated'];
  $('sheetBtn').textContent = '📊 ' + T['d.exportSheet'];
  $('closeBtn').textContent = T['w.close'];
  $('retryBtn').onclick = function(){
    _retries = 0; show('errorBox', false); show('progressBox', true);
    if (!_ticker) _ticker = setInterval(tick, 1000);
    _stateId ? next() : start();
  };
  $('sheetBtn').onclick = exportSheet;
  $('annotBtn').onclick = annotate;
  $('closeBtn').onclick = closeWindow;
  $('step1Lbl').textContent = T['w.stepPrep'];
  $('step2Lbl').textContent = T['w.stepCheck'];
  $('step3Lbl').textContent = T['w.stepDone'];
  setStatus(T['w.working']);
  if (!FILE_ID) { showError('No file selected.'); return; }
  _t0 = Date.now();
  tick();
  _ticker = setInterval(tick, 1000);
  run('apiPdfWebFileInfo', [FILE_ID], function(info){
    _fileName = info.name;
    if (_eta === null && info.etaSec) setEta(info.etaSec);
    $('fileLine').innerHTML = '<b>' + esc(info.name) + '</b> · ' + esc(info.mb) + ' MB · ' + esc(T['d.language']) + ': ' + esc(CHECK_LANG_NAME);
  }, function(){});
  start();
});

function setStatus(html){
  $('statusMsg').innerHTML = html;
}

// ─── Fortschritt und Restzeit ───────────────────────────────────────────
// Der Server schätzt nach jeder Etappe die Restzeit (etaSec, aus den gemessenen
// Dauern). Dazwischen zählt die Anzeige jede Sekunde herunter; der Balken zeigt
// vergangene Zeit / (vergangene + verbleibende Zeit) und läuft nie rückwärts.
var _t0 = 0, _eta = null, _etaAt = 0, _pctShown = 0, _ticker = null;
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s + ' min';
}
function setEta(sec){ _eta = sec; _etaAt = Date.now(); tick(); }
function tick(){
  var elapsed = (Date.now() - _t0) / 1000;
  $('elapsedText').innerHTML = t('w.elapsed', { t: fmtTime(elapsed) });
  if (_eta === null) { $('etaText').textContent = T['w.estimating']; return; }
  var rem = _eta - (Date.now() - _etaAt) / 1000;
  if (rem <= 3) { $('etaText').textContent = T['w.almost']; rem = 3; }
  else $('etaText').innerHTML = t('w.eta', { t: fmtTime(rem) });
  _pctShown = Math.max(_pctShown, Math.min(99, 100 * elapsed / (elapsed + rem)));
  setPct(_pctShown);
}
function setPct(p){
  $('pctText').textContent = Math.floor(p) + ' %';
  $('barFill').style.width = p + '%';
  $('bar').setAttribute('aria-valuenow', String(Math.floor(p)));
}
function setStep(n){
  for (var i = 1; i <= 3; i++) {
    $('step' + i).className = i < n ? 'done' : (i === n ? 'active' : '');
    if (i < 3) $('line' + i).className = 'line' + (i < n ? ' done' : '');
  }
}

function start(){
  run('apiPdfWebStart', [FILE_ID, CHECK_LANG], onStatus, onFail);
}
function next(){
  run('apiPdfWebContinue', [_stateId], onStatus, onFail);
}

// Nach jeder Etappe: Fortschritt anzeigen und automatisch weitermachen.
function onStatus(st){
  _retries = 0;
  if (st.stateId) _stateId = st.stateId;
  if (st.done) { finishProgress(); showResult(st.result); return; }
  setStep(st.step || 1);
  if (typeof st.etaSec === 'number') setEta(st.etaSec);
  if (st.phase === 'check') {
    setStatus(st.pagesTotal
      ? t('d.progress', { done: st.pagesDone, total: st.pagesTotal, n: st.issuesSoFar })
      : esc(T['d.checking']));
  } else {
    setStatus(t('d.prepProgress', { mb: st.fileMb, pct: Math.round(st.pct / 30 * 100) }));
  }
  next();
}

// Abbruch (z. B. Zeitlimit oder Verbindung): automatisch erneut versuchen - die
// nächste Etappe wird dabei kleiner. Beim Start (noch kein Zwischenstand) oder
// nach mehreren Fehlversuchen: Meldung mit "Erneut versuchen".
function onFail(err){
  var msg = (err && err.message) ? err.message : String(err);
  if (_stateId && _retries < MAX_AUTO_RETRIES) {
    _retries++;
    setStatus('⚠️ ' + t('w.retrying'));
    setTimeout(next, 2000 * _retries);
    return;
  }
  showError(msg);
}
function finishProgress(){
  if (_ticker) { clearInterval(_ticker); _ticker = null; }
  setStep(3);
  setPct(100);
  _duration = (Date.now() - _t0) / 1000;
}
var _duration = 0;

function showError(msg){
  if (_ticker) { clearInterval(_ticker); _ticker = null; }
  show('progressBox', false);
  show('errorBox', true);
  $('errorText').innerHTML = '⚠️ <b>' + esc(T['d.error']) + ':</b> ' + esc(msg);
}

function showResult(res){
  _result = res;
  show('progressBox', false);
  show('resultBox', true);
  var issues = res.issues || [], info = res.info || {};
  $('summary').textContent = (issues.length ? '🔎 ' : '🎉 ') + t('d.issuesFound', { n: issues.length }).replace(/<[^>]+>/g, '');
  var notes = _duration ? '<div class="small" style="margin-top:4px;">⏱️ ' + esc(T['w.stepDone']) + ' · ' + esc(fmtTime(_duration)) + '</div>' : '';
  if (info.imagesRemoved) notes += '<div class="note">ℹ️ ' + t('d.shrunk', { mb: (info.fileSize / 1048576).toFixed(1), kept: info.imagesKept, removed: info.imagesRemoved }) + '</div>';
  if (info.failedRanges && info.failedRanges.length) notes += '<div class="note">⚠️ ' + t('d.failedPages', { pages: info.failedRanges.join(', ') }) + '</div>';
  if (!issues.length) notes += '<div class="note">✅ ' + t('d.noErrors') + '</div>';
  $('notes').innerHTML = notes;
  show('resultActions', issues.length > 0);
  $('annotHelp').innerHTML = issues.length ? t('d.annotHelp') : '';
  $('issues').innerHTML = issues.map(function(it){
    var type = (it.type === 'terminology' || it.type === 'grammar') ? it.type : 'style';
    return '<div class="issue"><div class="issue-head"><span class="badge ' + type + '">' + esc(T['type.' + type]) + '</span>' +
      (it.location ? '<span>📍 ' + esc(it.location) + '</span>' : '') + '</div>' +
      '<div class="issue-body"><div class="diff"><s>' + esc(it.original) + '</s><span class="arrow">→</span><b>' + esc(it.suggestion) + '</b></div>' +
      (it.explanation ? '<div class="expl">💡 ' + esc(it.explanation) + '</div>' : '') + '</div></div>';
  }).join('');
  $('closeHint').innerHTML = t('w.closeHint');
}

// Ergebnis-Links als echter Link anbieten (ein automatisch geöffneter Tab nach
// der Server-Antwort würde vom Browser als Popup blockiert).
function offerLink(url, label){
  var a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.className = 'btn primary'; a.textContent = label + ' ↗';
  $('annotOut').appendChild(a);
}

function exportSheet(){
  var btn = $('sheetBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>' + esc(T['w.working']);
  run('apiPdfWebExportSheet', [_result.resultId], function(url){
    btn.textContent = '📊 ' + T['d.exportSheet'];
    offerLink(url, '📊 ' + T['w.open'] + ' (Sheet)');
  }, function(err){
    btn.disabled = false; btn.textContent = '📊 ' + T['d.exportSheet'];
    alert(t('d.exportError', { msg: err && err.message ? err.message : String(err) }).replace(/<[^>]+>/g, ''));
  });
}

function annotate(){
  var btn = $('annotBtn'), tries = 0;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + esc(T['d.creatingAnnot']);
  function onAnnot(r){
    tries = 0;
    if (r.done) {
      btn.textContent = '🖍️ ' + T['d.annotReady'];
      offerLink(r.url, '🖍️ ' + T['w.open'] + ' (PDF)');
      return;
    }
    // Große Datei: wird stückweise geschrieben - automatisch weiter.
    btn.innerHTML = '<span class="spinner"></span>' + esc(T['d.creatingAnnot']) + ' · ' + r.pct + ' %';
    run('apiPdfWebAnnotateContinue', [r.state], onAnnot, onAnnotFail(r.state));
  }
  function onAnnotFail(state){
    return function(err){
      if (state && tries < MAX_AUTO_RETRIES) {
        tries++;
        setTimeout(function(){ run('apiPdfWebAnnotateContinue', [state], onAnnot, onAnnotFail(state)); }, 2000 * tries);
        return;
      }
      btn.disabled = false; btn.textContent = '🖍️ ' + T['d.openAnnotated'];
      alert((err && err.message) ? err.message : String(err));
    };
  }
  run('apiPdfWebAnnotate', [_result.resultId], onAnnot, onAnnotFail(null));
}

function closeWindow(){
  try { window.top.close(); } catch (e) {}
  try { window.close(); } catch (e) {}
}
</script>
</body>
</html>

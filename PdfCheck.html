<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFED00; --yellow-dim:#E6D500; --ink:#3A3A3A; --white:#FFFFFF;
  --gray-50:#FAFAFA; --gray-100:#F2F2F2; --gray-150:#E9E9E9; --gray-200:#DDDDDD; --gray-300:#C4C4C4;
  --gray-400:#9A9A9A; --gray-500:#767676; --gray-600:#565656; --red:#D32F2F; --green:#2E7D32;
  --ff-head:"Oswald","Arial Narrow",sans-serif; --ff-body:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:var(--white); color:var(--ink); font-family:var(--ff-body); font-size:15px; -webkit-font-smoothing:antialiased; }
#app{ max-width:1440px; margin:0 auto; padding:22px 24px 40px; }
.grid{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:18px; align-items:start; }
.grid.result{ grid-template-columns:minmax(340px,440px) minmax(0,1fr); }
.grid > * { min-width:0; }
.sticky{ position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto; padding-right:4px; }
@media (max-width: 960px){ .grid, .grid.result{ grid-template-columns:1fr; } .sticky{ position:static; } }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip{ font-size:12.5px; border:1px solid var(--gray-200); background:var(--gray-50); padding:4px 10px; color:var(--gray-600); }
.chip b{ color:var(--ink); }
.box-title{ font-family:var(--ff-head); font-size:14px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; margin-bottom:12px; }
.tl{ width:100%; border-collapse:collapse; font-size:13.5px; }
.tl td{ padding:7px 6px; border-bottom:1px solid var(--gray-150); vertical-align:middle; }
.tl td.ic{ width:26px; text-align:center; }
.tl td.tm{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:600; }
.tl td.dt{ color:var(--gray-500); font-size:12.5px; }
.tl tr.pending td{ color:var(--gray-400); }
.tl tr.pending td.tm{ font-weight:400; }
.tl tr.active td{ background:#FFFBE0; }
.tl tr.sum td{ border-top:2px solid var(--ink); border-bottom:none; font-weight:700; }
.batches{ margin-top:12px; max-height:230px; overflow-y:auto; border:1px solid var(--gray-150); }
.batches div{ display:flex; justify-content:space-between; gap:10px; padding:5px 10px; font-size:12.5px; border-bottom:1px solid var(--gray-100); }
.batches div:nth-child(odd){ background:var(--gray-50); }
.batches .n{ color:var(--gray-500); }
.sub-title{ font-size:12px; font-weight:600; color:var(--gray-500); text-transform:uppercase; letter-spacing:.4px; margin-top:14px; }
.tiles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }
.tile{ border:1px solid var(--gray-150); background:var(--gray-50); padding:10px 12px; }
.tile .v{ font-family:var(--ff-head); font-size:22px; font-weight:600; line-height:1.1; }
.tile .l{ font-size:12px; color:var(--gray-500); margin-top:2px; }
.filters{ display:flex; flex-direction:column; gap:6px; }
.filter{ display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--gray-200); cursor:pointer; user-select:none; }
.filter:hover{ background:var(--gray-50); }
.filter input{ width:18px; height:18px; accent-color:var(--ink); cursor:pointer; }
.filter .cnt{ margin-left:auto; font-family:var(--ff-head); font-weight:600; font-size:15px; }
.filter.off{ opacity:.55; }
.linkbtn{ background:none; border:none; padding:0; font:inherit; font-size:13px; color:var(--ink); text-decoration:underline; cursor:pointer; }
.sel-row{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin:10px 0 2px; font-size:13px; color:var(--gray-500); }
.actions.stack{ flex-direction:column; align-items:stretch; }
.actions.stack .btn{ justify-content:center; }
.list-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:18px; }
.issue-no{ font-family:var(--ff-head); font-weight:600; color:var(--ink); }
details.box > summary{ cursor:pointer; list-style:none; }
details.box > summary::-webkit-details-marker{ display:none; }
details.box > summary::after{ content:'▾'; float:right; color:var(--gray-400); }
details.box[open] > summary{ margin-bottom:10px; }
.brand{ font-family:var(--ff-head); font-size:12px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--gray-500); }
h1{ font-family:var(--ff-head); font-size:22px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; margin:2px 0 4px; }
.file{ font-size:14px; color:var(--gray-600); word-break:break-word; }
.file b{ color:var(--ink); }
.box{ border:1px solid var(--gray-200); padding:18px; margin-top:18px; }
.steps{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; list-style:none; margin-bottom:18px; }
.steps li{ display:flex; align-items:center; gap:8px; font-family:var(--ff-head); font-size:13px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; color:var(--gray-400); }
.steps .dot{ width:24px; height:24px; border-radius:50%; border:2px solid var(--gray-300); display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--gray-400); background:var(--white); }
.steps li.active{ color:var(--ink); }
.steps li.active .dot{ border-color:var(--ink); background:var(--yellow); color:var(--ink); }
.steps li.done{ color:var(--gray-600); }
.steps li.done .dot{ border-color:var(--ink); background:var(--ink); color:var(--yellow); }
.steps .line{ flex:1; height:2px; background:var(--gray-200); min-width:24px; }
.steps .line.done{ background:var(--ink); }
.prog-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.pct{ font-family:var(--ff-head); font-size:34px; font-weight:600; line-height:1; }
.eta{ text-align:right; }
.eta-main{ font-size:16px; font-weight:600; }
.eta-sub{ font-size:12.5px; color:var(--gray-500); margin-top:2px; }
.bar{ position:relative; height:14px; background:var(--gray-150); margin:12px 0 12px; overflow:hidden; border-radius:7px; }
.bar > div{ height:100%; width:0; border-radius:7px; background:var(--yellow); box-shadow:inset 0 0 0 1px var(--yellow-dim);
  background-image:linear-gradient(45deg, rgba(58,58,58,.10) 25%, transparent 25%, transparent 50%, rgba(58,58,58,.10) 50%, rgba(58,58,58,.10) 75%, transparent 75%);
  background-size:20px 20px; animation:stripes 1s linear infinite; transition:width 1s linear; }
@keyframes stripes{ to{ background-position:20px 0; } }
@media (prefers-reduced-motion: reduce){ .bar > div{ animation:none; transition:none; } }
.status{ font-size:14px; line-height:1.5; }
.hint{ font-size:13px; color:var(--gray-500); margin-top:8px; line-height:1.45; }
.spinner{ display:inline-block; width:14px; height:14px; border:2px solid var(--gray-300); border-top-color:var(--ink); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.error{ border-color:var(--red); }
.error .status{ color:var(--red); }
.btn{ display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--ink); background:var(--white); color:var(--ink);
  font-family:var(--ff-head); font-size:13px; font-weight:600; letter-spacing:.5px; text-transform:uppercase;
  padding:9px 14px; cursor:pointer; text-decoration:none; }
.btn:hover{ background:var(--gray-100); }
.btn.primary{ background:var(--yellow); border-color:var(--yellow); }
.btn.primary:hover{ background:var(--yellow-dim); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; align-items:center; }
.link-out{ font-size:14px; font-weight:600; color:var(--ink); }
.summary{ font-family:var(--ff-head); font-size:20px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; }
.note{ margin-top:10px; padding:8px 10px; background:#FFF8D6; border-left:3px solid var(--yellow); font-size:13px; line-height:1.45; }
.issue{ border:1px solid var(--gray-200); margin-top:10px; }
#issues .issue:first-child{ margin-top:0; }
.issue-head{ display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--gray-50); border-bottom:1px solid var(--gray-150); font-size:13px; color:var(--gray-500); }
.badge{ font-family:var(--ff-head); font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:2px 8px; }
.badge.terminology{ background:var(--yellow); color:var(--ink); }
.badge.grammar{ background:var(--gray-200); color:var(--gray-600); }
.badge.style{ background:var(--ink); color:var(--yellow); }
.issue-body{ padding:10px 12px; }
.diff{ font-size:15px; line-height:1.5; word-break:break-word; }
.diff s{ color:var(--red); text-decoration-thickness:1.5px; }
.diff .arrow{ color:var(--gray-400); margin:0 6px; }
.diff b{ font-weight:600; }
.expl{ font-size:13.5px; color:var(--gray-500); margin-top:4px; line-height:1.5; }
.small{ font-size:12.5px; color:var(--gray-500); margin-top:10px; line-height:1.45; }
.hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="brand">Kärcher TermCheck</div>
  <h1 id="title"></h1>
  <div class="file" id="fileLine"></div>
  <div class="chips" id="chips"></div>

  <div class="grid" id="progressView">
    <div class="box" id="progressBox">
      <ol class="steps">
        <li id="step1" class="active"><span class="dot">1</span><span id="step1Lbl"></span></li>
        <li class="line" id="line1" aria-hidden="true"></li>
        <li id="step2"><span class="dot">2</span><span id="step2Lbl"></span></li>
        <li class="line" id="line2" aria-hidden="true"></li>
        <li id="step3"><span class="dot">3</span><span id="step3Lbl"></span></li>
      </ol>
      <div class="prog-head">
        <div class="pct" id="pctText">0 %</div>
        <div class="eta">
          <div class="eta-main" id="etaText" aria-live="polite"></div>
          <div class="eta-sub" id="elapsedText"></div>
        </div>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div id="barFill"></div></div>
      <div class="status" id="statusText"><span class="spinner"></span><span id="statusMsg"></span></div>
      <div class="hint" id="keepOpen"></div>
    </div>
    <div class="box" id="timelineBox">
      <div class="box-title" id="tlTitle"></div>
      <div id="timeline"></div>
    </div>
  </div>

  <div class="box error hidden" id="errorBox">
    <div class="status" id="errorText"></div>
    <div class="actions"><button class="btn primary" id="retryBtn"></button></div>
  </div>

  <div class="grid result hidden" id="resultBox" style="margin-top:18px;">
    <div class="sticky">
      <div class="box" style="margin-top:0;">
        <div class="summary" id="summary"></div>
        <div class="tiles" id="tiles"></div>
        <div id="notes"></div>
      </div>
      <div class="box" id="exportBox">
        <div class="box-title" id="filterTitle"></div>
        <div class="filters" id="filters"></div>
        <div class="sel-row">
          <span id="selCount"></span>
          <span><button class="linkbtn" id="selAll"></button> · <button class="linkbtn" id="selNone"></button></span>
        </div>
        <div class="actions stack" id="resultActions">
          <button class="btn primary" id="annotBtn"></button>
          <button class="btn" id="sheetBtn"></button>
        </div>
        <div class="actions stack" id="annotOut"></div>
        <div class="small" id="annotHelp"></div>
      </div>
      <details class="box" id="timelineResult">
        <summary class="box-title" id="tlTitle2" style="margin-bottom:0;"></summary>
        <div id="timeline2"></div>
      </details>
      <div class="actions" style="margin-top:18px;">
        <button class="btn" id="closeBtn"></button>
      </div>
      <div class="small" id="closeHint"></div>
    </div>
    <div>
      <div id="issues"></div>
    </div>
  </div>
</div>

<script>
// Vom Server (DrivePdfWeb.gs): Datei, Prüfsprache und alle Texte in der UI-Sprache.
var FILE_ID = <?!= JSON.stringify(fileId) ?>;
var CHECK_LANG = <?!= JSON.stringify(checkLang) ?>;
var CHECK_LANG_NAME = <?!= JSON.stringify(checkLangName) ?>;
var T = <?!= JSON.stringify(texts) ?>;

var MAX_AUTO_RETRIES = 3;
var _stateId = null, _retries = 0, _result = null, _fileName = '';

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Texte dürfen <b>/<i>/<br> enthalten (vertrauenswürdig, vom Server); eingesetzte Werte werden escaped.
function t(key, vars){
  var s = T[key] || key;
  return s.replace(/\{(\w+)\}/g, function(m, n){ return (vars && n in vars) ? esc(vars[n]) : m; });
}
function $(id){ return document.getElementById(id); }
function show(id, on){ $(id).classList.toggle('hidden', !on); }
function run(fn, args, ok, fail){
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
  r[fn].apply(r, args);
}

var TYPES = ['terminology', 'grammar', 'style'];
var PHASES = ['plan', 'fetch', 'full', 'assemble', 'split', 'check', 'doc'];
var _info = {}, _selected = {}, _lastSt = null, _lastStAt = 0, _finalTimes = null;

document.addEventListener('DOMContentLoaded', function(){
  $('title').textContent = '📄 ' + (T['w.title'] || 'PDF check');
  $('keepOpen').innerHTML = '⏳ ' + t('w.keepOpen');
  $('retryBtn').textContent = '🔄 ' + (T['w.retry'] || 'Try again');
  $('closeBtn').textContent = T['w.close'];
  $('tlTitle').textContent = '⏱️ ' + T['w.timeline'];
  $('tlTitle2').textContent = '⏱️ ' + T['w.timeline'];
  $('filterTitle').textContent = '🗂️ ' + T['w.filterTitle'];
  $('selAll').textContent = T['w.all'];
  $('selNone').textContent = T['w.none'];
  $('retryBtn').onclick = function(){
    _retries = 0; show('errorBox', false); show('progressView', true);
    if (!_ticker) _ticker = setInterval(tick, 1000);
    _stateId ? next() : start();
  };
  $('sheetBtn').onclick = exportSheet;
  $('annotBtn').onclick = annotate;
  $('closeBtn').onclick = closeWindow;
  $('selAll').onclick = function(){ setAll(true); };
  $('selNone').onclick = function(){ setAll(false); };
  $('step1Lbl').textContent = T['w.stepPrep'];
  $('step2Lbl').textContent = T['w.stepCheck'];
  $('step3Lbl').textContent = T['w.stepDone'];
  setStatus(T['w.working']);
  if (!FILE_ID) { showError('No file selected.'); return; }
  _t0 = Date.now();
  renderChips();
  renderTimeline();
  tick();
  _ticker = setInterval(tick, 1000);
  run('apiPdfWebFileInfo', [FILE_ID], function(info){
    _fileName = info.name;
    _info.mb = info.mb;
    if (_eta === null && info.etaSec) setEta(info.etaSec);
    $('fileLine').innerHTML = '<b>' + esc(info.name) + '</b>';
    renderChips();
  }, function(){});
  start();
});

function setStatus(html){
  $('statusMsg').innerHTML = html;
}

// Kennzahlen oben (Dateigröße, Sprache, Seiten, Pakete) - füllen sich nach und nach.
function renderChips(){
  var c = [];
  if (_info.mb) c.push([T['w.statSize'], _info.mb + ' MB']);
  c.push([T['d.language'], CHECK_LANG_NAME]);
  if (_info.pages) c.push([T['w.statPages'], _info.pages]);
  if (_info.parts) c.push([T['w.statParts'], _info.parts]);
  $('chips').innerHTML = c.map(function(x){ return '<span class="chip">' + esc(x[0]) + ': <b>' + esc(x[1]) + '</b></span>'; }).join('');
}

// ─── Fortschritt und Restzeit ───────────────────────────────────────────
// Der Server schätzt nach jeder Etappe die Restzeit (etaSec, aus den gemessenen
// Dauern). Dazwischen zählt die Anzeige jede Sekunde herunter; der Balken zeigt
// vergangene Zeit / (vergangene + verbleibende Zeit) und läuft nie rückwärts.
var _t0 = 0, _eta = null, _etaAt = 0, _pctShown = 0, _ticker = null;
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s + ' min';
}
function fmtShort(ms){
  var sec = Math.max(0, Math.round(ms / 1000));
  return sec < 60 ? sec + ' s' : fmtTime(sec);
}
function setEta(sec){ _eta = sec; _etaAt = Date.now(); tick(); }
function tick(){
  var elapsed = (Date.now() - _t0) / 1000;
  $('elapsedText').innerHTML = t('w.elapsed', { t: fmtTime(elapsed) });
  renderTimeline();
  if (_eta === null) { $('etaText').textContent = T['w.estimating']; return; }
  var rem = _eta - (Date.now() - _etaAt) / 1000;
  if (rem <= 3) { $('etaText').textContent = T['w.almost']; rem = 3; }
  else $('etaText').innerHTML = t('w.eta', { t: fmtTime(rem) });
  _pctShown = Math.max(_pctShown, Math.min(99, 100 * elapsed / (elapsed + rem)));
  setPct(_pctShown);
}
function setPct(p){
  $('pctText').textContent = Math.floor(p) + ' %';
  $('barFill').style.width = p + '%';
  $('bar').setAttribute('aria-valuenow', String(Math.floor(p)));
}
function setStep(n){
  for (var i = 1; i <= 3; i++) {
    $('step' + i).className = i < n ? 'done' : (i === n ? 'active' : '');
    if (i < 3) $('line' + i).className = 'line' + (i < n ? ' done' : '');
  }
}

// ─── Verlauf & Ladezeiten ───────────────────────────────────────────────
// Gemessene Dauer je Phase vom Server (timeline), die laufende Phase zählt live
// weiter. "Übertragung & Zwischenspeichern" = Gesamtzeit minus gemessene Phasen.
function timelineHtml(st, final){
  var tl = (st && st.timeline) || {}, cur = st ? (st.done ? '' : (st.docPrompts ? 'doc' : st.phase)) : 'plan';
  var curIdx = cur ? PHASES.indexOf(cur) : PHASES.length;
  var liveMs = st && !final ? Date.now() - _lastStAt : 0;
  var total = final ? _duration * 1000 : Date.now() - _t0, sum = 0, rows = '';
  PHASES.forEach(function(ph, i){
    var e = tl[ph], ms = e ? e.ms : 0, state;
    if (ph === cur && !final) { state = 'active'; ms += liveMs; }
    else if (e) state = 'done';
    else if (i < curIdx) return; // übersprungen (z. B. kleine PDF ohne Verkleinern)
    else if (ph === 'doc') return; // nur, wenn es Gesamtdokument-Prompts gibt
    else state = 'pending';
    if (final && !e) return;
    sum += ms;
    var detail = '';
    if (ph === 'check' && st && st.pagesTotal) detail = (st.done ? st.pagesTotal : (st.pagesDone || 0)) + ' / ' + st.pagesTotal + ' ' + T['w.statPages'];
    else if (ph === 'split' && _info.parts) detail = _info.parts + ' ' + T['w.statParts'];
    else if (e && e.n > 1 && ph !== 'check') detail = e.n + '×';
    var icon = state === 'done' ? '✅' : (state === 'active' ? '<span class="spinner" style="margin:0"></span>' : '○');
    rows += '<tr class="' + state + '"><td class="ic">' + icon + '</td><td>' + esc(T['w.ph.' + ph]) +
      '</td><td class="dt">' + esc(detail) + '</td><td class="tm">' + (state === 'pending' ? '–' : fmtShort(ms)) + '</td></tr>';
  });
  total = Math.max(total, sum);
  var io = Math.max(0, total - sum);
  if (st && io >= 1000) rows += '<tr' + (final ? '' : ' class="pending"') + '><td class="ic">🔁</td><td>' + esc(T['w.ph.io']) + '</td><td class="dt"></td><td class="tm">' + fmtShort(io) + '</td></tr>';
  rows += '<tr class="sum"><td class="ic">Σ</td><td>' + esc(T['w.total']) + '</td><td class="dt"></td><td class="tm">' + fmtShort(total) + '</td></tr>';
  var html = '<table class="tl">' + rows + '</table>';
  var log = (st && st.checkLog) || [];
  if (log.length) {
    html += '<div class="sub-title">🔎 ' + esc(T['w.checkBatches']) + ' (' + log.length + ')</div><div class="batches">' +
      log.slice().reverse().map(function(b){
        return '<div><span>' + t('w.batchLine', { from: b.from, to: b.to, n: b.n }) + '</span><span class="n">' + fmtShort(b.ms) + '</span></div>';
      }).join('') + '</div>';
  }
  return html;
}
function renderTimeline(){
  if (_finalTimes) return;
  // Nur neu zeichnen, wenn der Nutzer nicht gerade in der Etappen-Liste scrollt.
  var box = document.querySelector('#timeline .batches'), top = box ? box.scrollTop : 0;
  $('timeline').innerHTML = timelineHtml(_lastSt, false);
  box = document.querySelector('#timeline .batches');
  if (box) box.scrollTop = top;
}

function start(){
  run('apiPdfWebStart', [FILE_ID, CHECK_LANG], onStatus, onFail);
}
function next(){
  run('apiPdfWebContinue', [_stateId], onStatus, onFail);
}

// Nach jeder Etappe: Fortschritt anzeigen und automatisch weitermachen.
function onStatus(st){
  _retries = 0;
  if (st.stateId) _stateId = st.stateId;
  _lastSt = st; _lastStAt = Date.now();
  if (st.pagesTotal) { _info.pages = st.pagesTotal; _info.parts = st.partsTotal; renderChips(); }
  if (st.done) { finishProgress(); showResult(st.result); return; }
  setStep(st.step || 1);
  if (typeof st.etaSec === 'number') setEta(st.etaSec);
  if (st.docPrompts) {
    setStatus(t('d.docRunning', { n: st.docPrompts }));
  } else if (st.phase === 'check') {
    setStatus(st.pagesTotal
      ? t('d.progress', { done: st.pagesDone, total: st.pagesTotal, n: st.issuesSoFar })
      : esc(T['d.checking']));
  } else {
    setStatus(t('d.prepProgress', { mb: st.fileMb, pct: Math.round(st.pct / 30 * 100) }));
  }
  renderTimeline();
  next();
}

// Abbruch (z. B. Zeitlimit oder Verbindung): automatisch erneut versuchen - die
// nächste Etappe wird dabei kleiner. Beim Start (noch kein Zwischenstand) oder
// nach mehreren Fehlversuchen: Meldung mit "Erneut versuchen".
function onFail(err){
  var msg = (err && err.message) ? err.message : String(err);
  if (_stateId && _retries < MAX_AUTO_RETRIES) {
    _retries++;
    setStatus('⚠️ ' + t('w.retrying'));
    setTimeout(next, 2000 * _retries);
    return;
  }
  showError(msg);
}
function finishProgress(){
  if (_ticker) { clearInterval(_ticker); _ticker = null; }
  setStep(3);
  setPct(100);
  _duration = (Date.now() - _t0) / 1000;
}
var _duration = 0;

function showError(msg){
  if (_ticker) { clearInterval(_ticker); _ticker = null; }
  show('progressView', false);
  show('errorBox', true);
  $('errorText').innerHTML = '⚠️ <b>' + esc(T['d.error']) + ':</b> ' + esc(msg);
}

function typeOf(it){ return (it.type === 'terminology' || it.type === 'grammar') ? it.type : 'style'; }

function showResult(res){
  _result = res;
  show('progressView', false);
  show('resultBox', true);
  var issues = res.issues || [], info = res.info || {};
  if (info.pagesTotal) { _info.pages = info.pagesTotal; _info.parts = info.partsTotal; renderChips(); }
  $('summary').textContent = (issues.length ? '🔎 ' : '🎉 ') + t('d.issuesFound', { n: issues.length }).replace(/<[^>]+>/g, '');
  var prep = 0, tl = (_lastSt && _lastSt.timeline) || {};
  PHASES.forEach(function(ph){ if (ph !== 'check' && ph !== 'doc' && tl[ph]) prep += tl[ph].ms; });
  var tiles = [[issues.length, T['w.statIssues']], [fmtTime(_duration), T['w.statTime']]];
  if (info.pagesTotal) tiles.push([info.pagesTotal, T['w.statPages']]);
  tiles.push([_info.mb ? _info.mb + ' MB' : '–', T['w.statSize']]);
  $('tiles').innerHTML = tiles.map(function(x){ return '<div class="tile"><div class="v">' + esc(x[0]) + '</div><div class="l">' + esc(x[1]) + '</div></div>'; }).join('');
  var notes = '';
  if (info.imagesRemoved) notes += '<div class="note">ℹ️ ' + t('d.shrunk', { mb: (info.fileSize / 1048576).toFixed(1), kept: info.imagesKept, removed: info.imagesRemoved }) + '</div>';
  if (info.failedRanges && info.failedRanges.length) notes += '<div class="note">⚠️ ' + t('d.failedPages', { pages: info.failedRanges.join(', ') }) + '</div>';
  if (!issues.length) notes += '<div class="note">✅ ' + t('d.noErrors') + '</div>';
  // Bericht der Gesamtdokument-Prompts (eigenes Google Doc)
  var doc = res.docResult;
  if (doc) {
    notes += '<div class="note"><b>📄 ' + esc(T['d.docTitle']) + '</b>';
    if (doc.url) notes += '<div class="actions"><a class="btn primary" target="_blank" rel="noopener noreferrer" href="' + esc(doc.url) + '">' + esc(T['d.docReport']) + ' ↗</a></div>';
    (doc.items || []).forEach(function(it){
      if (it.error) notes += '<div>⚠️ <b>' + esc(it.title) + ':</b> ' + esc(it.error) + '</div>';
    });
    if (doc.error) notes += '<div>⚠️ ' + esc(doc.error) + '</div>';
    notes += '</div>';
  }
  $('notes').innerHTML = notes;
  $('timeline2').innerHTML = timelineHtml(_lastSt, true);
  _finalTimes = true;
  show('exportBox', issues.length > 0);
  $('annotHelp').innerHTML = issues.length ? t('d.annotHelp') : '';
  // Kategorien: nur die tatsächlich gefundenen, anfangs alle ausgewählt.
  var counts = {};
  issues.forEach(function(it){ var ty = typeOf(it); counts[ty] = (counts[ty] || 0) + 1; });
  _selected = {};
  $('filters').innerHTML = TYPES.filter(function(ty){ return counts[ty]; }).map(function(ty){
    _selected[ty] = true;
    return '<label class="filter" id="f_' + ty + '"><input type="checkbox" checked data-type="' + ty + '">' +
      '<span class="badge ' + ty + '">' + esc(T['type.' + ty]) + '</span><span class="cnt">' + counts[ty] + '</span></label>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#filters input'), function(cb){
    cb.onchange = function(){ _selected[cb.getAttribute('data-type')] = cb.checked; onSelectionChange(); };
  });
  $('closeHint').innerHTML = t('w.closeHint');
  onSelectionChange();
}

function setAll(on){
  Array.prototype.forEach.call(document.querySelectorAll('#filters input'), function(cb){
    cb.checked = on; _selected[cb.getAttribute('data-type')] = on;
  });
  onSelectionChange();
}
function selectedTypes(){ return TYPES.filter(function(ty){ return _selected[ty]; }); }
function selectedIssues(){
  return (_result.issues || []).filter(function(it){ return _selected[typeOf(it)]; });
}

// Auswahl geändert: Liste filtern, Zähler und Export-Buttons anpassen. Links zu
// einem früheren Export gehören zu einer anderen Auswahl - daher entfernen.
function onSelectionChange(){
  var all = _result.issues || [], sel = selectedIssues(), n = sel.length;
  TYPES.forEach(function(ty){ var el = $('f_' + ty); if (el) el.classList.toggle('off', !_selected[ty]); });
  $('selCount').innerHTML = n ? t('w.selectedCount', { n: n, total: all.length }) : esc(T['w.noneSelected']);
  $('annotOut').innerHTML = '';
  resetButtons();
  $('issues').innerHTML = sel.map(function(it, i){
    var type = typeOf(it);
    return '<div class="issue"><div class="issue-head"><span class="issue-no">' + (i + 1) + '</span><span class="badge ' + type + '">' + esc(T['type.' + type]) + '</span>' +
      (it.location ? '<span>📍 ' + esc(it.location) + '</span>' : '') + '</div>' +
      '<div class="issue-body"><div class="diff"><s>' + esc(it.original) + '</s><span class="arrow">→</span><b>' + esc(it.suggestion) + '</b></div>' +
      (it.explanation ? '<div class="expl">💡 ' + esc(it.explanation) + '</div>' : '') + '</div></div>';
  }).join('');
}
function resetButtons(){
  var n = selectedIssues().length;
  $('annotBtn').textContent = '🖍️ ' + T['d.openAnnotated'] + ' (' + n + ')';
  $('sheetBtn').textContent = '📊 ' + T['d.exportSheet'] + ' (' + n + ')';
  $('annotBtn').disabled = $('sheetBtn').disabled = !n || _busy;
}
var _busy = false;
function setBusy(on){
  _busy = on;
  Array.prototype.forEach.call(document.querySelectorAll('#filters input, #selAll, #selNone'), function(el){ el.disabled = on; });
  if (!on) resetButtons(); else { $('annotBtn').disabled = $('sheetBtn').disabled = true; }
}

// Ergebnis-Links als echter Link anbieten (ein automatisch geöffneter Tab nach
// der Server-Antwort würde vom Browser als Popup blockiert).
function offerLink(url, label){
  var a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.className = 'btn primary'; a.textContent = label + ' ↗';
  $('annotOut').appendChild(a);
}
function exportLabel(){
  var types = selectedTypes();
  return types.length === $('filters').querySelectorAll('input').length ? '' : ' – ' + types.map(function(ty){ return T['type.' + ty]; }).join(', ');
}

function exportSheet(){
  var btn = $('sheetBtn'), t0 = Date.now(), label = exportLabel();
  setBusy(true);
  btn.innerHTML = '<span class="spinner"></span>' + esc(T['w.working']);
  run('apiPdfWebExportSheet', [_result.resultId, selectedTypes()], function(url){
    setBusy(false);
    offerLink(url, '📊 ' + T['w.open'] + ' (Sheet' + label + ') · ' + fmtShort(Date.now() - t0));
  }, function(err){
    setBusy(false);
    alert(t('d.exportError', { msg: err && err.message ? err.message : String(err) }).replace(/<[^>]+>/g, ''));
  });
}

function annotate(){
  var btn = $('annotBtn'), tries = 0, t0 = Date.now(), label = exportLabel();
  setBusy(true);
  btn.innerHTML = '<span class="spinner"></span>' + esc(T['d.creatingAnnot']);
  function onAnnot(r){
    tries = 0;
    if (r.done) {
      setBusy(false);
      offerLink(r.url, '🖍️ ' + T['w.open'] + ' (PDF' + label + ') · ' + fmtShort(Date.now() - t0));
      return;
    }
    // Große Datei: wird stückweise geschrieben - automatisch weiter, mit Restzeit.
    var el = Date.now() - t0, rem = r.pct > 0 ? el * (100 - r.pct) / r.pct : 0;
    btn.innerHTML = '<span class="spinner"></span>' + esc(T['d.creatingAnnot']) + ' · ' + r.pct + ' %' +
      (rem ? ' · ' + t('w.eta', { t: fmtTime(rem / 1000) }) : '');
    run('apiPdfWebAnnotateContinue', [r.state], onAnnot, onAnnotFail(r.state));
  }
  function onAnnotFail(state){
    return function(err){
      if (state && tries < MAX_AUTO_RETRIES) {
        tries++;
        setTimeout(function(){ run('apiPdfWebAnnotateContinue', [state], onAnnot, onAnnotFail(state)); }, 2000 * tries);
        return;
      }
      setBusy(false);
      alert((err && err.message) ? err.message : String(err));
    };
  }
  run('apiPdfWebAnnotate', [_result.resultId, selectedTypes()], onAnnot, onAnnotFail(null));
}

function closeWindow(){
  try { window.top.close(); } catch (e) {}
  try { window.close(); } catch (e) {}
}
</script>
</body>

name: Deploy to Apps Script

# Überträgt den Stand von main per clasp (rootDir src/) in das Apps-Script-Projekt
# und hängt (optional) ein bestehendes Deployment an die neue Version.
# Nutzt dieselbe Deploy-Aktion wie alle Kärcher-Translation-Repositories
# (.github/actions/clasp-deploy). Benötigte Secrets (Settings > Secrets and variables > Actions):
#   CLASPRC_JSON   Inhalt von ~/.clasprc.json nach "clasp login"
#   SCRIPT_ID      Skript-ID des Apps-Script-Projekts
#   DEPLOYMENT_ID  (optional) Deployment, das auf die neue Version zeigen soll
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  # Erst alle Prüfungen (ci.yml), nur bei Erfolg deployen.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clasp-deploy
        with:
          clasprc: ${{ secrets.CLASPRC_JSON }}
          script-id: ${{ secrets.SCRIPT_ID }}
          deployment-id: ${{ secrets.DEPLOYMENT_ID }}
          description: GitHub ${{ github.sha }}

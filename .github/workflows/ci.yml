name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax, Manifest und doppelte Funktionen prüfen
        run: node ci/check.js
      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: UI-Test Terminologiesuche (Server-Code + Oberfläche im Browser)
        run: node ci/ui-smoke.js
